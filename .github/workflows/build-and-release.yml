name: Build and Release

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - 'tests/**'
      - 'benchmarks/**'
      - 'samples/**'
      - '.github/workflows/**'
      - '.release'
      - 'CHANGELOG.md'
      - 'README.md'
      - 'assets/**'
      - 'docs/**'
      - '*.sln'
      - 'Directory.Build.props'
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'tests/**'
      - 'benchmarks/**'
      - 'samples/**'
      - '.github/workflows/**'
      - '.release'
      - 'CHANGELOG.md'
      - 'README.md'
      - 'assets/**'
      - 'docs/**'
      - '*.sln'
      - 'Directory.Build.props'

env:
  CHANGELOG_PATH: CHANGELOG.md
  CONFIGURATION: Release
  COVERAGE_MINIMUM: '99.0'
  COVERAGE_OUTPUT: ./artifacts/coverage
  COVERAGE_REPORT: ./artifacts/coverage-report
  DOTNET_TARGET: .
  NUGET_OUTPUT: ./nupkgs
  NUGET_SOURCE: https://api.nuget.org/v3/index.json
  NUGET_USER: ${{ vars.NUGET_USER }}
  RELEASE_BRANCH_PREFIX: releases/
  RELEASE_BRANCH_PATTERN: ^releases/v[0-9]+\.[0-9]+\.[0-9]+$
  RELEASE_MARKER_PATH: .release
  RELEASE_NOTES_PATH: release_notes.txt
  RELEASE_TAG_PATTERN: ^v[0-9]+\.[0-9]+\.[0-9]+$

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore
        run: dotnet restore "$DOTNET_TARGET"

      - name: Build
        run: dotnet build "$DOTNET_TARGET" --no-restore --configuration "$CONFIGURATION"

      - name: Test
        run: dotnet test "$DOTNET_TARGET" --no-build --configuration "$CONFIGURATION" --verbosity normal

      - name: Collect coverage
        run: >
          dotnet test "$DOTNET_TARGET"
          --no-build
          --configuration "$CONFIGURATION"
          --framework net8.0
          --collect:"XPlat Code Coverage"
          --results-directory "$COVERAGE_OUTPUT"

      - name: Enforce coverage
        shell: bash
        run: |
          set -euo pipefail

          dotnet tool install --global dotnet-reportgenerator-globaltool --version 5.5.11
          reportgenerator \
            "-reports:$COVERAGE_OUTPUT/**/coverage.cobertura.xml" \
            "-targetdir:$COVERAGE_REPORT" \
            "-reporttypes:TextSummary;Cobertura" \
            "-verbosity:Warning"

          LINE_COVERAGE="$(awk -F': ' '/^  Line coverage:/ { gsub(/%/, "", $2); print $2 }' "$COVERAGE_REPORT/Summary.txt")"
          BRANCH_COVERAGE="$(awk -F': ' '/^  Branch coverage:/ { split($2, value, "%"); print value[1] }' "$COVERAGE_REPORT/Summary.txt")"

          echo "Line coverage: $LINE_COVERAGE%"
          echo "Branch coverage: $BRANCH_COVERAGE%"

          awk -v actual="$LINE_COVERAGE" -v minimum="$COVERAGE_MINIMUM" 'BEGIN { exit actual >= minimum ? 0 : 1 }' || {
            echo "Line coverage must be at least $COVERAGE_MINIMUM%."
            exit 1
          }
          awk -v actual="$BRANCH_COVERAGE" -v minimum="$COVERAGE_MINIMUM" 'BEGIN { exit actual >= minimum ? 0 : 1 }' || {
            echo "Branch coverage must be at least $COVERAGE_MINIMUM%."
            exit 1
          }

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: ${{ env.COVERAGE_REPORT }}
          if-no-files-found: error

      - name: Resolve release marker
        id: release
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail

          echo "should_release=false" >> "$GITHUB_OUTPUT"

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            BRANCH="${GITHUB_REF_NAME}"

            if [[ ! "$BRANCH" =~ $RELEASE_BRANCH_PATTERN ]]; then
              echo "Manual production releases must run from a branch matching $RELEASE_BRANCH_PATTERN. Current branch: $BRANCH"
              exit 1
            fi

            TAG="${BRANCH#"$RELEASE_BRANCH_PREFIX"}"
            VERSION="${TAG#v}"

            if ! grep -q -E "^## \\[$TAG\\]" "$CHANGELOG_PATH"; then
              echo "$CHANGELOG_PATH must contain a section for $TAG before releasing."
              exit 1
            fi

            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" | grep -qx "$RELEASE_MARKER_PATH"; then
            echo "$RELEASE_MARKER_PATH did not change in this push. Skipping release."
            exit 0
          fi

          if [[ ! -f "$RELEASE_MARKER_PATH" ]]; then
            echo "$RELEASE_MARKER_PATH was removed. Skipping release."
            exit 0
          fi

          NON_EMPTY_LINES="$(grep -cve '^[[:space:]]*$' "$RELEASE_MARKER_PATH" || true)"
          if [[ "$NON_EMPTY_LINES" != "1" ]]; then
            echo "$RELEASE_MARKER_PATH must contain exactly one non-empty line with the release tag, for example v1.0.0."
            exit 1
          fi

          TAG="$(grep -ve '^[[:space:]]*$' "$RELEASE_MARKER_PATH" | tr -d '[:space:]')"
          if [[ ! "$TAG" =~ $RELEASE_TAG_PATTERN ]]; then
            echo "$RELEASE_MARKER_PATH must contain a tag matching $RELEASE_TAG_PATTERN. Current value: $TAG"
            exit 1
          fi

          if ! grep -q -E "^## \\[$TAG\\]" "$CHANGELOG_PATH"; then
            echo "$CHANGELOG_PATH must contain a section for $TAG before releasing."
            exit 1
          fi

          VERSION="${TAG#v}"
          BRANCH="$RELEASE_BRANCH_PREFIX$TAG"

          echo "should_release=true" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Create release branch
        if: steps.release.outputs.should_release == 'true'
        shell: bash
        run: |
          set -euo pipefail

          BRANCH="${{ steps.release.outputs.branch }}"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "Release branch $BRANCH already exists. Skipping creation."
            exit 0
          fi

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git branch "$BRANCH" "${{ github.sha }}"
          git push origin "refs/heads/$BRANCH"

      - name: Prepare release notes
        if: steps.release.outputs.should_release == 'true'
        shell: bash
        run: |
          set -euo pipefail

          TAG="${{ steps.release.outputs.tag }}"
          TAG_LINE=$(grep -m1 -E "^## \\[$TAG\\]" "$CHANGELOG_PATH" || true)

          awk -v tag_line="$TAG_LINE" '
            $0 == tag_line { in_section=1; next }
            in_section && /^## / { exit }
            in_section
          ' "$CHANGELOG_PATH" > "$RELEASE_NOTES_PATH"

          if [[ ! -s "$RELEASE_NOTES_PATH" ]]; then
            echo "$CHANGELOG_PATH section for $TAG is empty."
            exit 1
          fi

      - name: Pack NuGet packages
        if: steps.release.outputs.should_release == 'true'
        run: >
          dotnet pack "$DOTNET_TARGET"
          --configuration "$CONFIGURATION"
          --output "$NUGET_OUTPUT"
          /p:Version=${{ steps.release.outputs.version }}
          /p:PackageVersion=${{ steps.release.outputs.version }}
          /p:MinVerVersionOverride=${{ steps.release.outputs.version }}

      - name: Create or update release tag
        if: steps.release.outputs.should_release == 'true'
        shell: bash
        run: |
          set -euo pipefail

          TAG="${{ steps.release.outputs.tag }}"
          HEAD_SHA="$(git rev-parse HEAD)"

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
            TAG_SHA="$(git rev-list -n 1 "$TAG")"

            if [[ "$TAG_SHA" == "$HEAD_SHA" ]]; then
              echo "Tag $TAG already points to $HEAD_SHA. Nothing to update."
            else
              echo "Tag $TAG points to $TAG_SHA and will be moved to $HEAD_SHA."
              git tag --force "$TAG" "$HEAD_SHA"
              git push --force origin "refs/tags/$TAG"
            fi
          else
            git tag --force "$TAG" "$HEAD_SHA"
            git push origin "refs/tags/$TAG"
          fi

      - name: Create GitHub Release
        if: steps.release.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: ${{ steps.release.outputs.tag }}
          body_path: ${{ env.RELEASE_NOTES_PATH }}
          draft: false
          prerelease: false
          files: |
            ${{ env.NUGET_OUTPUT }}/*.nupkg
            ${{ env.NUGET_OUTPUT }}/*.snupkg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate NuGet trusted publishing user
        if: steps.release.outputs.should_release == 'true'
        shell: bash
        run: |
          if [[ -z "$NUGET_USER" ]]; then
            echo "Repository variable NUGET_USER must be set to the nuget.org username that created the Trusted Publishing policy."
            echo "This is not necessarily the package owner, organization, GitHub repository owner, or policy name."
            exit 1
          fi

      - name: NuGet trusted publishing login
        if: steps.release.outputs.should_release == 'true'
        uses: NuGet/login@v1
        id: nuget_login
        with:
          user: ${{ env.NUGET_USER }}

      - name: Push to NuGet
        if: steps.release.outputs.should_release == 'true'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          packages=("$NUGET_OUTPUT"/*.nupkg)
          symbols=("$NUGET_OUTPUT"/*.snupkg)

          if (( ${#packages[@]} == 0 )); then
            echo "No .nupkg files were found in $NUGET_OUTPUT."
            exit 1
          fi

          for package in "${packages[@]}"; do
            dotnet nuget push "$package" -k ${{ steps.nuget_login.outputs.NUGET_API_KEY }} -s "$NUGET_SOURCE" --skip-duplicate
          done

          for symbol in "${symbols[@]}"; do
            dotnet nuget push "$symbol" -k ${{ steps.nuget_login.outputs.NUGET_API_KEY }} -s "$NUGET_SOURCE" --skip-duplicate
          done
